<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gulf Coast Fishing Guide">
  <!--
    Maskable app icon. Platforms may crop this to any shape inscribed in the
    circle of radius 205 (the 80% safe zone), so the full-bleed background runs
    edge to edge and all content stays inside that circle.
    Colours are locked brand values: royal blue #075bd8, key lime #8dff00.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#075bd8"/>
      <stop offset="1" stop-color="#031530"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Water line, inside the safe zone -->
  <path d="M116 340 q 35 -26 70 0 t 70 0 t 70 0 t 70 0"
        fill="none" stroke="#8dff00" stroke-width="14" stroke-linecap="round" opacity=".95"/>
  <path d="M116 386 q 35 -26 70 0 t 70 0 t 70 0 t 70 0"
        fill="none" stroke="#8dff00" stroke-width="10" stroke-linecap="round" opacity=".55"/>

  <!-- Wordmark -->
  <text x="256" y="248"
        font-family="'Bricolage Grotesque', 'Helvetica Neue', system-ui, sans-serif"
        font-size="150" font-weight="800" letter-spacing="-6"
        text-anchor="middle" fill="#8dff00">GC</text>
</svg>
